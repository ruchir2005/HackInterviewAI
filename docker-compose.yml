version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: interview-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-interviews}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./interview-backend
    ports:
      - "8000:8000"
    env_file:
      - ./interview-backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-interviews}
      - INSTITUTION_PROXY_SECRET=${INSTITUTION_PROXY_SECRET}
    volumes:
      - ./interview-backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    tty: true

  frontend:
    build: 
      context: ./ai-mock-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000
      - INSTITUTION_PROXY_SECRET=${INSTITUTION_PROXY_SECRET}
    restart: unless-stopped

volumes:
  postgres_data:
